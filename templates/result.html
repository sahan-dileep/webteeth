<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Result</title>
    <!-- Bootstrap Dark Theme -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #212529;
            color: #f8f9fa;
            min-height: 100vh;
        }
        .result-container {
            max-width: 800px;
            margin: 0 auto;
            padding: 2rem;
            background-color: #2c3034;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
        }
        .result-image {
            max-width: 100%;
            height: auto;
            border: 1px solid #495057;
            border-radius: 5px;
            margin-bottom: 1.5rem;
        }
    </style>
</head>
<body class="d-flex align-items-center">
    <div class="container">
        <div class="result-container mt-5">
            <h1 class="text-center mb-4">Segmentation Result</h1>
            <div class="text-center">
                <img src="{{ url_for('uploaded_file', filename='result.jpg') }}" alt="Result" class="result-image">
                <br>
                <a href="/" class="btn btn-outline-light">Upload Another Image</a>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
