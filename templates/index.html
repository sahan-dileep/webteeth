<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YOLO Image Segmentation</title>
    <!-- Bootstrap Dark Theme -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #212529;
            color: #f8f9fa;
            min-height: 100vh;
        }
        .upload-container {
            max-width: 600px;
            margin: 0 auto;
            padding: 2rem;
            background-color: #2c3034;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
        }
        .form-control {
            background-color: #495057;
            color: #f8f9fa;
            border: 1px solid #6c757d;
        }
        .form-control:focus {
            background-color: #495057;
            color: #f8f9fa;
            border-color: #0d6efd;
            box-shadow: 0 0 0 0.25rem rgba(13, 110, 253, 0.25);
        }
    </style>
</head>
<body class="d-flex align-items-center">
    <div class="container">
        <div class="upload-container mt-5">
            <h1 class="text-center mb-4">Upload an Image for Segmentation</h1>
            <form method="POST" enctype="multipart/form-data" class="text-center">
                <div class="mb-3">
                    <input class="form-control" type="file" name="image" accept="image/*" required>
                </div>
                <button type="submit" class="btn btn-primary btn-lg">Upload and Process</button>
            </form>
        </div>
    </div>

    <!-- Bootstrap JS Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
